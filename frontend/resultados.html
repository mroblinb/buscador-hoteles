<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Resultados de búsqueda de hoteles - HotelBooking">
    <meta name="theme-color" content="#2C3E50">
    <title>Resultados - HotelBooking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏨</text></svg>">
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
    <header>
        <a href="/">HotelBooking</a>
        <a href="/">← Nueva búsqueda</a>
    </header>

    <div class="container">
        <div class="resultados-header">
            <h2 id="tituloResultados">Hoteles disponibles</h2>
            <span id="contador"></span>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Buscando hoteles...</p>
        </div>

        <div id="errorContainer" style="display:none;"></div>

        <div id="hotelGrid" class="hotel-grid"></div>

        <div id="noResults" class="no-results" style="display:none;">
            <h3>No se encontraron hoteles</h3>
            <p>Intenta modificar los criterios de búsqueda.</p>
        </div>
    </div>

    <script src="js/resultados.js?v=2"></script>
</body>
</html>
